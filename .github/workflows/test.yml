name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux zsh
      - name: Install tmux (macOS, if missing)
        if: runner.os == 'macOS'
        run: command -v tmux >/dev/null || brew install tmux
      - name: Install bun (runs the pi extension test)
        uses: oven-sh/setup-bun@v2
      - name: Run tests
        run: bash tests/run-all.sh
