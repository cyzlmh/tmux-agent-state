# tmux-agent-state adapter for kimi code (https://www.kimi.com/code).
#
# install.sh appends this to ~/.kimi-code/config.toml (replacing
# __AGENT_STATE__ with the absolute path of adapters/agent-state.sh), so the
# same shared hook script that serves claude/codex writes @agent-state for
# kimi too. Event reference:
# https://www.kimi.com/code/docs/en/kimi-code-cli/customization/hooks.html

[[hooks]]
event = "SessionStart"
command = "__AGENT_STATE__ --agent kimi --state waiting --detail ready --adapter-version 2"

# NOTE: TurnStarted also covers turns with no user prompt (background tasks,
# goals, cron), but it is deliberately not used here: the installed CLI
# (0.42.0) validates config.toml hooks against an enum that has no
# TurnStarted, and a single unknown event makes kimi reject the whole hooks
# key. PreToolUse below still flips such turns to busy on the first tool call.

[[hooks]]
event = "UserPromptSubmit"
command = "__AGENT_STATE__ --agent kimi --state busy --detail working --adapter-version 2"

[[hooks]]
event = "PreToolUse"
command = "__AGENT_STATE__ --agent kimi --state busy --detail working --adapter-version 2"

[[hooks]]
event = "PostToolUse"
command = "__AGENT_STATE__ --agent kimi --state busy --detail working --adapter-version 2"

# a tool that failed or was blocked still means the turn is running
[[hooks]]
event = "PostToolUseFailure"
command = "__AGENT_STATE__ --agent kimi --state busy --detail working --adapter-version 2"

[[hooks]]
event = "PermissionRequest"
command = "__AGENT_STATE__ --agent kimi --state waiting --detail asking --adapter-version 2"

[[hooks]]
event = "PermissionResult"
command = "__AGENT_STATE__ --agent kimi --state busy --detail working --adapter-version 2"

[[hooks]]
event = "Stop"
command = "__AGENT_STATE__ --agent kimi --state waiting --detail done --adapter-version 2"

# the turn ended without Stop: error or Esc — the agent is idle either way
[[hooks]]
event = "StopFailure"
command = "__AGENT_STATE__ --agent kimi --state waiting --detail done --adapter-version 2"

[[hooks]]
event = "Interrupt"
command = "__AGENT_STATE__ --agent kimi --state waiting --detail done --adapter-version 2"

# NOTE: Notification is deliberately not used: kimi only fires it for
# background-task status changes (payload type is "task.<status>", e.g.
# task.completed) — the same thing pi reports as detail=bg, not a
# needs-input signal.

[[hooks]]
event = "SessionEnd"
command = "__AGENT_STATE__ --clear --adapter-version 2"
